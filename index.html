<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>3D Selfie Scanner</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    background:#000;
    font-family:Arial,sans-serif;
    overflow:hidden;
    color:white;
}

/* CAMERA SCREEN */

#cameraScreen{
    position:relative;
    width:100%;
    height:100vh;
}

video{
    width:100%;
    height:100%;
    object-fit:cover;
}

/* PERMISSION */

.permission{
    position:absolute;
    inset:0;
    background:#000;
    display:flex;
    flex-direction:column;
    justify-content:center;
    align-items:center;
    z-index:100;
    padding:20px;
    text-align:center;
}

.permission h1{
    font-size:34px;
    margin-bottom:15px;
}

.permission p{
    opacity:0.8;
    margin-bottom:30px;
    line-height:1.6;
}

.permission button{
    padding:16px 35px;
    border:none;
    border-radius:50px;
    background:linear-gradient(135deg,#ff0080,#7928ca);
    color:white;
    font-size:18px;
    cursor:pointer;
}

/* GUIDE */

.overlay{
    position:absolute;
    inset:0;
    display:flex;
    justify-content:center;
    align-items:center;
    pointer-events:none;
}

.guide{
    width:250px;
    height:350px;
    border:3px dashed rgba(255,255,255,0.8);
    border-radius:25px;
    animation:pulse 2s infinite;
}

@keyframes pulse{
    0%,100%{
        transform:scale(1);
    }
    50%{
        transform:scale(1.03);
    }
}

/* TEXT */

.top{
    position:absolute;
    top:30px;
    width:100%;
    text-align:center;
    z-index:10;
}

.top h1{
    font-size:30px;
    margin-bottom:8px;
}

.top p{
    opacity:0.7;
}

/* BOTTOM */

.bottom{
    position:absolute;
    bottom:35px;
    width:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:20px;
    z-index:10;
}

.angle{
    background:rgba(0,0,0,0.5);
    padding:12px 28px;
    border-radius:50px;
    font-size:22px;
    font-weight:bold;
}

.capture{
    width:90px;
    height:90px;
    border-radius:50%;
    border:6px solid white;
    background:rgba(255,255,255,0.15);
    backdrop-filter:blur(10px);
    cursor:pointer;
}

.progress{
    display:flex;
    gap:12px;
}

.dot{
    width:14px;
    height:14px;
    border-radius:50%;
    background:rgba(255,255,255,0.3);
}

.active{
    background:white;
    transform:scale(1.3);
}

/* VIEWER */

#viewerScreen{
    display:none;
    width:100%;
    height:100vh;
    position:relative;
    overflow:hidden;
}

.scene{
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    perspective:1200px;
}

.viewer{
    width:250px;
    height:350px;
    position:relative;
    transform-style:preserve-3d;
    transition:transform 0.1s linear;
}

.face{
    position:absolute;
    width:250px;
    height:350px;
    overflow:hidden;
    border-radius:20px;
    background:#111;
    border:2px solid rgba(255,255,255,0.15);
    box-shadow:0 20px 40px rgba(0,0,0,0.5);
}

.face img{
    width:100%;
    height:100%;
    object-fit:cover;
}

.front{
    transform:translateZ(125px);
}

.back{
    transform:rotateY(180deg) translateZ(125px);
}

.left{
    transform:rotateY(-90deg) translateZ(125px);
}

.right{
    transform:rotateY(90deg) translateZ(125px);
}

.controls{
    position:absolute;
    bottom:40px;
    width:100%;
    display:flex;
    justify-content:center;
    gap:15px;
    z-index:10;
}

.controls button{
    padding:14px 22px;
    border:none;
    border-radius:50px;
    background:rgba(255,255,255,0.12);
    color:white;
    font-size:16px;
    backdrop-filter:blur(10px);
    cursor:pointer;
}

</style>
</head>

<body>

<!-- CAMERA SCREEN -->

<div id="cameraScreen">

    <video id="video" autoplay playsinline></video>

    <div class="permission" id="permissionScreen">

        <h1>3D Selfie Scanner</h1>

        <p>
            Allow camera access and capture 4 angles
            to generate your 3D selfie.
        </p>

        <button onclick="enableCamera()">
            Allow Camera
        </button>

    </div>

    <div class="top">

        <h1>Capture Your 3D Selfie</h1>

        <p>Align your face inside frame</p>

    </div>

    <div class="overlay">
        <div class="guide"></div>
    </div>

    <div class="bottom">

        <div class="angle" id="angleText">
            FRONT
        </div>

        <button class="capture" id="captureBtn"></button>

        <div class="progress">
            <div class="dot active"></div>
            <div class="dot"></div>
            <div class="dot"></div>
            <div class="dot"></div>
        </div>

    </div>

</div>

<!-- VIEWER SCREEN -->

<div id="viewerScreen">

    <div class="scene" id="downloadArea">

        <div class="viewer" id="viewer">

            <div class="face front">
                <img id="frontImg">
            </div>

            <div class="face back">
                <img id="backImg">
            </div>

            <div class="face left">
                <img id="leftImg">
            </div>

            <div class="face right">
                <img id="rightImg">
            </div>

        </div>

    </div>

    <div class="controls">

        <button onclick="rotateLeft()">⟲ Left</button>

        <button onclick="rotateRight()">⟳ Right</button>

        <button onclick="downloadSelfie()">
            ⬇ Download
        </button>

    </div>

</div>

<script>

const video = document.getElementById("video");

const captureBtn = document.getElementById("captureBtn");

const angleText = document.getElementById("angleText");

const dots = document.querySelectorAll(".dot");

const viewer = document.getElementById("viewer");

const angles = [
    "FRONT",
    "LEFT",
    "RIGHT",
    "BACK"
];

let current = 0;

let rotateY = 0;

let photos = [];

/* CAMERA */

async function enableCamera(){

    try{

        const stream =
        await navigator.mediaDevices.getUserMedia({
            video:{
                facingMode:"user"
            },
            audio:false
        });

        video.srcObject = stream;

        document.getElementById(
            "permissionScreen"
        ).style.display = "none";

    }catch(err){

        alert(
            "Please allow camera permission"
        );

    }

}

/* CAPTURE */

captureBtn.addEventListener("click",()=>{

    const canvas =
    document.createElement("canvas");

    canvas.width = video.videoWidth;

    canvas.height = video.videoHeight;

    const ctx = canvas.getContext("2d");

    ctx.drawImage(video,0,0);

    const image =
    canvas.toDataURL("image/png");

    photos.push(image);

    dots[current].classList.remove("active");

    current++;

    if(current < angles.length){

        angleText.innerText =
        angles[current];

        dots[current].classList.add("active");

    }else{

        generateViewer();

    }

});

/* GENERATE VIEWER */

function generateViewer(){

    document.getElementById(
        "cameraScreen"
    ).style.display = "none";

    document.getElementById(
        "viewerScreen"
    ).style.display = "block";

    document.getElementById(
        "frontImg"
    ).src = photos[0];

    document.getElementById(
        "leftImg"
    ).src = photos[1];

    document.getElementById(
        "rightImg"
    ).src = photos[2];

    document.getElementById(
        "backImg"
    ).src = photos[3];

}

/* ROTATE */

function rotateLeft(){

    rotateY -= 90;

    updateRotation();

}

function rotateRight(){

    rotateY += 90;

    updateRotation();

}

function updateRotation(){

    viewer.style.transform =
    `rotateY(${rotateY}deg)`;

}

/* DRAG ROTATE */

let isDragging = false;

let startX = 0;

document.addEventListener(
    "mousedown",
    (e)=>{

    isDragging = true;

    startX = e.clientX;

});

document.addEventListener(
    "mouseup",
    ()=>{

    isDragging = false;

});

document.addEventListener(
    "mousemove",
    (e)=>{

    if(!isDragging) return;

    const delta =
    e.clientX - startX;

    rotateY += delta * 0.3;

    updateRotation();

    startX = e.clientX;

});

/* MOBILE TOUCH */

document.addEventListener(
    "touchstart",
    (e)=>{

    startX = e.touches[0].clientX;

});

document.addEventListener(
    "touchmove",
    (e)=>{

    const delta =
    e.touches[0].clientX - startX;

    rotateY += delta * 0.25;

    updateRotation();

    startX = e.touches[0].clientX;

});

/* DOWNLOAD */

function downloadSelfie(){

    html2canvas(
        document.getElementById(
            "downloadArea"
        )
    ).then(canvas=>{

        const link =
        document.createElement("a");

        link.download =
        "3d-selfie.png";

        link.href =
        canvas.toDataURL("image/png");

        link.click();

    });

}

</script>

</body>
</html>
